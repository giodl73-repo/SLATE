name: Aggregate adaptation proposal
description: Propose a bounded SLATE aggregate education-access review.
title: "Aggregate adaptation: "
labels: ["adoption", "privacy-boundary"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for aggregate-only SLATE work. Do not include student records or individual educational advice.
  - type: input
    id: scope
    attributes:
      label: Bounded scope
      placeholder: "Example: regional program access and pathway continuity"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Education-access promise question
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Aggregate source surfaces
    validations:
      required: true
  - type: textarea
    id: held
    attributes:
      label: Claims that must stay held
    validations:
      required: true

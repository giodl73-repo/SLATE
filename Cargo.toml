[workspace]
resolver = "2"
members = [
    "crates/slate-network",
    "crates/slate-corpus",
    "crates/slate-score",
    "crates/slate-tier",
    "crates/slate-gap",
    "crates/slate-cli",
    "crates/slate-web",
]


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

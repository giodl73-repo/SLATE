[package]
name = "slate-web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "slate-browser"
path = "src/main.rs"

[dependencies]
slate-network = { path = "../slate-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
